    - { ticker: XOM,   name: "ExxonMobil",         type: stock, region: US, currency: USD, sector: Energy }
    - { ticker: SHEL.L, name: "Shell",             type: stock, region: UK, currency: GBp, sector: Energy }
    - { ticker: BP.L,  name: "BP",                 type: stock, region: UK, currency: GBp, sector: Energy }
    - { ticker: TTE.PA, name: "TotalEnergies",     type: stock, region: FR, currency: EUR, sector: Energy }
    - { ticker: RIO.L, name: "Rio Tinto",          type: stock, region: UK, currency: GBp, sector: Materials }
    - { ticker: SIE.DE, name: "Siemens",           type: stock, region: DE, currency: EUR, sector: Industrials }
    - { ticker: CAT,   name: "Caterpillar",        type: stock, region: US, currency: USD, sector: Industrials }
