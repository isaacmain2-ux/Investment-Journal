    - { ticker: JPM,   name: "JPMorgan Chase",     type: stock, region: US, currency: USD, sector: Financials }
    - { ticker: V,     name: "Visa",               type: stock, region: US, currency: USD, sector: Financials }
    - { ticker: HSBA.L, name: "HSBC",              type: stock, region: UK, currency: GBp, sector: Financials }
