# ==============================================================================
# macro_series.yaml  -  FRED macro / rates / credit / vol universe
# Investment Journal - Phases 1a / 1a-T (+ vol term-structure addition)
# ------------------------------------------------------------------------------
# Scope: US + UK/Europe macro    Source: FRED    History from 2005-01-01
# ------------------------------------------------------------------------------
# Each entry:
#   id         FRED series id (passed straight to the API)
#   name       human-readable label
#   region     US | UK | EU | DE | GLOBAL
#   freq       D | W | M | Q   (native frequency)
#   transform  level | yoy | mom   -> drives primary_value / primary_zscore
#                level : mean-reverting series (rates, spreads, vol, sentiment)
#                yoy   : trending index series (CPI, GDP, output, money)
#                mom   : flow series (payrolls)
#   verify     (optional) true = used by the pre-flight connectivity check
#
# Series marked "# added" are the vol term-structure / inflation-forward additions.
# ==============================================================================

meta:
  source: FRED
  history_start: "2005-01-01"
  base_currency: "GBP"
  
series:

  # ---------------------------------------------------------------- growth
  growth:
    - { id: GDPC1,   name: "Real GDP",                     region: US, freq: Q, transform: yoy }
    - { id: INDPRO,  name: "Industrial Production",        region: US, freq: M, transform: yoy }
    - { id: RSAFS,   name: "Retail Sales",                 region: US, freq: M, transform: yoy }
    - { id: PAYEMS,  name: "Nonfarm Payrolls",             region: US, freq: M, transform: mom }
    - { id: ICSA,    name: "Initial Jobless Claims",       region: US, freq: W, transform: level }
    - { id: UNRATE,  name: "Unemployment Rate",            region: US, freq: M, transform: level }
    - { id: UMCSENT, name: "U. Michigan Consumer Sentiment", region: US, freq: M, transform: level }
    - { id: HOUST,   name: "Housing Starts",               region: US, freq: M, transform: yoy }

  # ---------------------------------------------------------------- inflation
  inflation:
    - { id: CPIAUCSL, name: "CPI (headline)",              region: US, freq: M, transform: yoy }
    - { id: CPILFESL, name: "Core CPI",                    region: US, freq: M, transform: yoy }
    - { id: PCEPILFE, name: "Core PCE",                    region: US, freq: M, transform: yoy }

  # -------------------------------------------------- inflation expectations
  inflation_expectations:
    - { id: T5YIE,   name: "5-year breakeven inflation",           region: US, freq: D, transform: level }   # added
    - { id: T10YIE,  name: "10-year breakeven inflation",          region: US, freq: D, transform: level }
    - { id: T5YIFR,  name: "5y5y forward inflation expectation",   region: US, freq: D, transform: level }

  # ---------------------------------------------------------------- policy rates
  policy_rates:
    - { id: DFF,     name: "Fed Funds Effective Rate",     region: US, freq: D, transform: level }
    - { id: ECBDFR,  name: "ECB Deposit Facility Rate",    region: EU, freq: D, transform: level }
    - { id: IUDSOIA, name: "UK SONIA",                     region: UK, freq: D, transform: level }

  # ---------------------------------------------------------- treasury curve
  treasury_curve:
    - { id: DGS1MO,  name: "US 1-month Treasury yield",    region: US, freq: D, transform: level }
    - { id: DGS3MO,  name: "US 3-month Treasury yield",    region: US, freq: D, transform: level }
    - { id: DGS6MO,  name: "US 6-month Treasury yield",    region: US, freq: D, transform: level }
    - { id: DGS1,    name: "US 1-year Treasury yield",     region: US, freq: D, transform: level }
    - { id: DGS2,    name: "US 2-year Treasury yield",     region: US, freq: D, transform: level }
    - { id: DGS3,    name: "US 3-year Treasury yield",     region: US, freq: D, transform: level }
    - { id: DGS5,    name: "US 5-year Treasury yield",     region: US, freq: D, transform: level }
    - { id: DGS7,    name: "US 7-year Treasury yield",     region: US, freq: D, transform: level }
    - { id: DGS10,   name: "US 10-year Treasury yield",    region: US, freq: D, transform: level, verify: true }
    - { id: DGS20,   name: "US 20-year Treasury yield",    region: US, freq: D, transform: level }
    - { id: DGS30,   name: "US 30-year Treasury yield",    region: US, freq: D, transform: level }

  # ---------------------------------------------------------- curve spreads
  curve_spreads:
    - { id: T10Y2Y,  name: "10y minus 2y (2s10s slope)",   region: US, freq: D, transform: level }
    - { id: T10Y3M,  name: "10y minus 3m (3m10y slope)",   region: US, freq: D, transform: level }

  # -------------------------------------------------- real yields & premium
  real_yields:
    - { id: DFII5,       name: "US 5-year TIPS real yield",   region: US, freq: D, transform: level }
    - { id: DFII10,      name: "US 10-year TIPS real yield",  region: US, freq: D, transform: level }
    - { id: THREEFYTP10, name: "10-year term premium (KW)",   region: US, freq: D, transform: level }

  # -------------------------------------------------- international rates
  intl_rates:
    - { id: IRLTLT01GBM156N, name: "UK 10-year govt yield",      region: UK, freq: M, transform: level }
    - { id: IRLTLT01EZM156N, name: "Euro area 10-year govt yield", region: EU, freq: M, transform: level }
    - { id: IRLTLT01DEM156N, name: "Germany 10-year govt yield", region: DE, freq: M, transform: level }

  # ---------------------------------------------------------------- credit
  credit:
    - { id: BAMLC0A0CM,    name: "IG corporate OAS",        region: US, freq: D, transform: level }
    - { id: BAMLH0A0HYM2,  name: "HY corporate OAS",        region: US, freq: D, transform: level }
    - { id: BAMLC0A1CAAA,  name: "AAA corporate OAS",       region: US, freq: D, transform: level }
    - { id: BAMLC0A2CAA,   name: "AA corporate OAS",        region: US, freq: D, transform: level }
    - { id: BAMLC0A3CA,    name: "A corporate OAS",         region: US, freq: D, transform: level }
    - { id: BAMLC0A4CBBB,  name: "BBB corporate OAS",       region: US, freq: D, transform: level }
    - { id: BAMLH0A1HYBB,  name: "BB corporate OAS",        region: US, freq: D, transform: level }
    - { id: BAMLH0A2HYB,   name: "B corporate OAS",         region: US, freq: D, transform: level }
    - { id: BAMLH0A3HYC,   name: "CCC corporate OAS",       region: US, freq: D, transform: level }
    - { id: BAMLEMCBPIOAS, name: "EM corporate OAS",        region: GLOBAL, freq: D, transform: level }

  # ------------------------------------------------- financial conditions
  conditions:
    - { id: NFCI,    name: "Chicago Fed National Financial Conditions Index", region: US, freq: W, transform: level }
    - { id: STLFSI4, name: "St. Louis Fed Financial Stress Index",            region: US, freq: W, transform: level }

  # ------------------------------------------------------- money & liquidity
  money_liquidity:
    - { id: M2SL,  name: "M2 Money Supply",                region: US, freq: M, transform: yoy }
    - { id: WALCL, name: "Fed Total Assets (balance sheet)", region: US, freq: W, transform: yoy }

  # ---------------------------------------------------------------- volatility
  volatility:
    - { id: VIXCLS,   name: "VIX (30-day)",                region: US, freq: D, transform: level }
    - { id: VXVCLS,   name: "VIX 3-month (VIX3M)",         region: US, freq: D, transform: level }   # added
    - { id: OVXCLS,   name: "Crude oil ETF vol (OVX)",     region: US, freq: D, transform: level }   # added
    - { id: GVZCLS,   name: "Gold ETF vol (GVZ)",          region: US, freq: D, transform: level }   # added
    - { id: VXEEMCLS, name: "Emerging-markets ETF vol",    region: US, freq: D, transform: level }   # added
    - { id: EVZCLS,   name: "Euro FX vol (EVZ)",           region: US, freq: D, transform: level }   # added (verify id)
    - { id: VXNCLS,   name: "Nasdaq-100 vol (VXN)",        region: US, freq: D, transform: level }   # added (verify id)
    - { id: RVXCLS,   name: "Russell 2000 vol (RVX)",      region: US, freq: D, transform: level }   # added (verify id)

  # ------------------------------------------------------------------- fx
  fx:
    - { id: DTWEXBGS, name: "Broad US Dollar Index",       region: US,     freq: D, transform: level }
    - { id: DEXUSUK,  name: "USD per GBP",                 region: GLOBAL, freq: D, transform: level }
    - { id: DEXUSEU,  name: "USD per EUR",                 region: GLOBAL, freq: D, transform: level }

  # ------------------------------------------------------------ commodities
  commodities:
    - { id: DCOILWTICO,   name: "WTI crude oil",           region: GLOBAL, freq: D, transform: level }
    - { id: DCOILBRENTEU, name: "Brent crude oil",         region: GLOBAL, freq: D, transform: level }

  # ---------------------------------------------------------- international
  international:
    - { id: CP0000EZ19M086NEST, name: "Euro area HICP",        region: EU, freq: M, transform: yoy }
    - { id: LRHUTTTTEZM156S,    name: "Euro area unemployment", region: EU, freq: M, transform: level }
    - { id: GBRCPIALLMINMEI,    name: "UK CPI",                region: UK, freq: M, transform: yoy }
    - { id: LRHUTTTTGBM156S,    name: "UK unemployment",       region: UK, freq: M, transform: level }
    - { id: NGDPRSAXDCGBQ,      name: "UK Real GDP",           region: UK, freq: Q, transform: yoy }