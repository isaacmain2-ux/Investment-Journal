name: Daily

# Runs the whole pipeline once a day in GitHub's cloud, then publishes the dashboard.
on:
  schedule:
    - cron: "7 22 * * *"        # 22:07 UTC daily (after the US close, off-peak)
  workflow_dispatch: {}          # adds a manual "Run workflow" button for testing

permissions:
  contents: write                # to commit the accumulated state CSVs
  pages: write                   # to publish the dashboard to GitHub Pages
  id-token: write                # required by the Pages deploy action

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the pipeline
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python run_cloud.py

      - name: Commit accumulated state
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/state/*.csv 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no state changes to commit"
          else
            git commit -m "state: daily accumulation $(date -u +%F)"
            git push
          fi

      - name: Upload the dashboard for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
